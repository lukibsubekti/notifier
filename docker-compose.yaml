services:
  notifier:
    container_name: notifier-server
    env_file:
      - path: .env
        required: true
    image: luki/notifier:latest
    ports:
      # container port is based on APP_PORT value defined in your .env file
      - "3001:3001"
    volumes:
      # replace sample templates with yours
      - ./templates:/app/templates
    restart: on-failure
    